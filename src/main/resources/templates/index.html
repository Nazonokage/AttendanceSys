<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Attendance</title><link rel="stylesheet" href="/app.css"><script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script defer src="/app.js"></script></head><body><header><h1>Attendance / Scanner</h1><a href="/admin">Admin dashboard</a></header><main class="scanner"><p>Hold your student QR code in front of the camera.</p><div id="message" role="status" aria-live="polite"></div><section class="card"><h2>Scan QR code</h2><div id="reader"></div><p>Camera access requires localhost or HTTPS.</p></section><section class="card"><h2>Enter student ID</h2><form data-api="/api/scan" data-json="true"><label for="id">Student ID</label><input id="id" name="idNum" required><button>Record attendance</button></form><p>Wait at least 30 seconds before scanning out.</p></section></main></body></html>
